# FXOS Production Deployment
# 镜像部署 - 从 GitHub Container Registry 拉取官方镜像
# 镜像由 .github/workflows/docker-build.yml 在 dev 分支推送(ghcr.io/onecany/fxos/fxos-*:dev)
#
# 一键部署命令:
#   curl -fsSL https://raw.githubusercontent.com/onecany/fxos/dev/scripts/install.sh | bash
#
# 或手动部署:
#   curl -O https://raw.githubusercontent.com/onecany/fxos/dev/scripts/docker/docker-compose.prod.yml
#   docker compose pull && docker compose up -d

services:
  fxos:
    image: ghcr.io/onecany/fxos/fxos-backend:dev
    container_name: fxos-trading
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # Backend API is host-loopback only: the frontend reaches it via the
      # docker network, install.sh healthcheck uses 127.0.0.1. Do NOT expose
      # it to 0.0.0.0 — gin trusts all proxies by default and a public API
      # would allow spoofed X-Forwarded-For to bypass the login rate limiter.
      - "127.0.0.1:${FXOS_BACKEND_PORT:-8080}:8080"
    volumes:
      # Data directory for database and logs
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - fxos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (mandatory single-port HTTPS)
  # Host ${FXOS_FRONTEND_PORT:-3000} → Container 443 (HTTPS/TLS)
  # Same-port HTTP→HTTPS upgrade handled inside nginx via error_page 497.
  fxos-frontend:
    image: ghcr.io/onecany/fxos/fxos-frontend:dev
    container_name: fxos-frontend
    restart: unless-stopped
    ports:
      - "${FXOS_FRONTEND_PORT:-3000}:443"
    volumes:
      # SSL certificates (auto-generated by install.sh by default)
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      - FXOS_SERVER_IP=${FXOS_SERVER_IP:-}
    networks:
      - fxos-network
    depends_on:
      - fxos
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --no-check-certificate --spider https://127.0.0.1/health || wget --no-verbose --tries=1 --spider http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  fxos-network:
    driver: bridge
