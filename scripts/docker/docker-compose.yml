# FXOS Development / Local Build Deployment
# 源码构建部署 - 在仓库根目录运行:
#   docker compose --project-directory . -f scripts/docker/docker-compose.yml up -d --build
# 注意:volumes/env_file 的相对路径一律相对 project directory(--project-directory 指定的目录),
# 因此必须用上面的命令(或把本文件放到仓库根再运行),否则 ./data、./.env、./ssl 会指向错误位置。
# build.context 指向仓库根(../.. 相对本文件位置),因此无论从仓库根还是 scripts/docker/ 启动都能正确构建。

services:
  # Backend service (API and core logic)
  fxos:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile.backend
    container_name: fxos-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    ports:
      - "127.0.0.1:${FXOS_BACKEND_PORT:-8080}:8080"
      # pprof profiling is bound to host loopback only; uncomment for local debug.
      # - "127.0.0.1:6060:6060"
    volumes:
      # NOTE: .env is bind-mounted so the beginner-onboarding flow
      # (persistBeginnerWalletEnv) can write CLAW402_WALLET_* back to the host
      # file. Without this mount the wallet is regenerated on every container
      # restart. For threat models where the .env file should not be reachable
      # via container RCE, deploy via env vars only and remove this mount.
      - ./.env:/app/.env
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
    networks:
      - fxos-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (mandatory single-port HTTPS)
  # Host ${FXOS_FRONTEND_PORT:-3000} → Container 443 (HTTPS/TLS)
  # Same-port HTTP→HTTPS upgrade is handled inside nginx via error_page 497.
  fxos-frontend:
    build:
      context: ../..
      dockerfile: scripts/docker/Dockerfile.frontend
    container_name: fxos-frontend
    restart: unless-stopped
    ports:
      - "${FXOS_FRONTEND_PORT:-3000}:443"
    volumes:
      # SSL certificates (auto-generated by start.sh / install.sh by default)
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      - FXOS_SERVER_IP=${FXOS_SERVER_IP:-}
    networks:
      - fxos-network
    depends_on:
      - fxos
    healthcheck:
      # The only host-exposed port is now 443→3000. Internal healthcheck
      # still uses container-local HTTP(80) which redirects but /health on
      # HTTPS(443) is what matters for real end-to-end TLS probing.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --no-check-certificate --spider https://127.0.0.1/health || wget --no-verbose --tries=1 --spider http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  fxos-network:
    driver: bridge
