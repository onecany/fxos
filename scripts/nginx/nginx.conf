# nginx.conf - FXOS Frontend (Single-port HTTPS, mandatory)
#
# Design:
#   • Listen 443 ssl (HTTPS) — maps to host port ${FXOS_FRONTEND_PORT:-3000}
#   • Users who visit http://<host>:3000 by mistake will hit the SSL port with
#     plaintext HTTP → nginx raises error 497 → we catch with error_page and
#     301-redirect to the same host:port but https://
#   • Listen 80 is still defined inside the container so the entrypoint can
#     still start without certs (worst-case fallback handled by entrypoint).
#     Port 80 is NOT exposed to the host via docker-compose (see yml files).
#     When both certs work fine, 80 also redirects to $http_host (== host:3000)
#     via https so any internal traffic inside the docker network also gets
#     forced up to HTTPS.
#
# Features: gzip, static asset caching, API proxy preserving /api/ path,
# extended timeouts, SPA fallback routing, modern TLS defaults,
# HSTS + HTTP→HTTPS upgrade both inside-container and same-port.

# ──────────────────────────────────────────────────────────────────
# Port 80 (internal only; always redirects to HTTPS on same $http_host)
# ──────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Redirect everything to HTTPS, preserving the host:port the user typed
    # (so when we redirect it lands on https://<same-ip>:3000 as user expects)
    return 301 https://$http_host$request_uri;
}

# ──────────────────────────────────────────────────────────────────
# Port 443 SSL — the only host-exposed frontend port (→ host:3000)
# ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    # ── SSL material (paths match docker-entrypoint.sh + compose volume) ──
    ssl_certificate     /etc/nginx/ssl/fxos.crt;
    ssl_certificate_key /etc/nginx/ssl/fxos.key;

    # Modern TLS settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Same-port HTTP→HTTPS upgrade ────────────────────────────────
    # When a user mistakenly types http://IP:3000 (plaintext hits our SSL
    # listener), nginx emits error 497 (HTTP request sent to HTTPS port).
    # Instead of returning 4xx, we 301-redirect them to https:// on the
    # EXACT same host:port — which already points at this same 443 listener,
    # now properly over TLS. $http_host preserves ":3000" so the user never
    # sees another port number.
    error_page 497 = @upgrade_to_https;
    location @upgrade_to_https {
        return 301 https://$http_host$request_uri;
    }

    # HSTS (2 years, subdomains) — browsers that have seen this once will
    # silently rewrite http:// links to https:// before even hitting the
    # network, which eliminates the 497 round-trip for repeat visitors.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Standard frontend serving setup ──────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # index.html — never cache (new deployments take effect immediately)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
    }

    # SPA routes + static asset caching for hashed filenames
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy /api/* to the backend Go service
    location /api/ {
        proxy_pass http://fxos:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check — useful so `./start.sh status` can probe + docker
    # healthcheck runs without having to add --no-check-certificate flags.
    # NOTE: $http_host is only populated when Host header exists; keep
    # returning 200 directly here so it works from `docker exec` probes too.
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
        access_log off;
    }
}
